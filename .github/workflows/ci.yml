name: Frontend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  # The checks that decide whether a change is good: all of them pass on main.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:gateway
      - run: npm audit --omit=dev --audit-level=high

  # Browser tests across many screen sizes. Two of them (touch drag-and-drop at 320x568 and the
  # account/course flows at 1487px) already failed before this job was split out, and the courses
  # test is flaky under load, so this job reports but does not block. Make it required again once
  # those are fixed by removing continue-on-error.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:responsive
