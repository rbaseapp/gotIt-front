# Example frontend-owned reverse proxy. Configure GotIt hostname before deployment.
# Replace GOTIT_API_HOST with the approved GotIt service hostname, without scheme.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /core-api/ {
        proxy_pass https://rbase-core-api.onrender.com/;
        proxy_set_header Host rbase-core-api.onrender.com;
        proxy_ssl_server_name on;
    }

    location /gotit-api/ {
        proxy_pass https://GOTIT_API_HOST/;
        proxy_set_header Host GOTIT_API_HOST;
        proxy_ssl_server_name on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
