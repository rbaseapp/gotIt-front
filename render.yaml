services:
  - type: web
    name: gotit-front
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    envVars:
      - key: CORE_API_PROXY_TARGET
        value: https://rbase-core-api.onrender.com
      - key: GOTIT_API_PROXY_TARGET
        value: https://gotit-backend.onrender.com
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: PUBLIC_APP_ORIGIN
        sync: false
      - key: PADDLE_CLIENT_TOKEN
        sync: false
      - key: PADDLE_ENVIRONMENT
        value: production
      - key: PADDLE_PRO_MONTHLY_PRICE_ID
        sync: false
      # Add PADDLE_PRO_YEARLY_PRICE_ID after a yearly Pro price exists in Paddle and Core.
